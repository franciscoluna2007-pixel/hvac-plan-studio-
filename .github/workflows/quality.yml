name: Website quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --use-system-ca

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build, unit tests, and browser regression suite
        run: npm test

      - name: Lighthouse audit
        run: npm run test:lighthouse
